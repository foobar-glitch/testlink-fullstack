<!-- app-header.component.html -->
<!-- Sticky top navigation — mirrors the React shop's .user-header -->
<header class="app-header">

  <!-- Logo / brand -->
  <a class="brand" routerLink="/projects">
    <div class="brand-icon">
      <!-- Inline SVG checkmark-in-circle TestFlow logo -->
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="10" r="9" stroke="#6c63ff" stroke-width="1.8"/>
        <path d="M6 10.5l2.5 2.5 5-5" stroke="#6c63ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="brand-name">TestFlow</span>
  </a>

  <!-- Breadcrumb / nav pills -->
  <nav class="breadcrumb" *ngIf="breadcrumbs.length > 0">
    <ng-container *ngFor="let crumb of breadcrumbs; let last = last">
      <a class="crumb" [routerLink]="crumb.link" *ngIf="!last">{{ crumb.label }}</a>
      <span class="crumb-sep" *ngIf="!last">›</span>
      <span class="crumb current" *ngIf="last">{{ crumb.label }}</span>
    </ng-container>
  </nav>

  <!-- Spacer -->
  <div class="spacer"></div>

  <!-- Right-side icons -->
  <div class="icons" *ngIf="currentUser">
    <span class="user-pill">
      <span class="avatar">{{ initials }}</span>
      <span class="username">{{ currentUser.username }}</span>
    </span>
    <button class="icon-btn" title="Logout" (click)="logout()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>

</header>
