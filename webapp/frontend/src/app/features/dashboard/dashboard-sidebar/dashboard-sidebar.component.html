<div class="sidebar">
  <div class="sidebar-header">
    <span>Test Suites</span>
    <div>
      <button (click)="expandAll()" title="Expand all">⊕</button>
      <button (click)="collapseAll()" title="Collapse all">⊖</button>
    </div>
  </div>
  <div class="tree-container">
    <ng-container *ngIf="suiteTree?.length; else empty">
      <ng-container *ngTemplateOutlet="tree; context: { $implicit: suiteTree }"></ng-container>
    </ng-container>
    <ng-template #empty>
      <div class="empty-tree">No suites available</div>
    </ng-template>
  </div>
</div>

<ng-template #tree let-nodes>
  <ul class="tree">
    <li *ngFor="let node of nodes" class="tree-node">
      <div class="node-row" (click)="selectNode(node)">
        <span
          class="toggle"
          [class.has-children]="hasChildren(node)"
          (click)="toggleNode(node, $event)"
        >
          <span *ngIf="hasChildren(node)">{{ isExpanded(node) ? '▼' : '▶' }}</span>
          <span *ngIf="!hasChildren(node)">•</span>
        </span>
        <span class="icon">{{ node.children?.length ? '📁' : '📄' }}</span>
        <span class="name">{{ node.name }}</span>
        <span *ngIf="node.children?.length" class="badge">{{ node.children.length }}</span>
      </div>
      <ng-container *ngIf="isExpanded(node) && hasChildren(node)">
        <ng-container *ngTemplateOutlet="tree; context: { $implicit: node.children }"></ng-container>
      </ng-container>
    </li>
  </ul>
</ng-template>
