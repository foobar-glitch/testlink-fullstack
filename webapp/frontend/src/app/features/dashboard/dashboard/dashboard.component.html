<div class="dashboard-container">
  <!-- Top Context Bar -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">TF</div>
      <span>TestHarbor</span>
    </div>

    <div class="context-selectors">
      <select
        [(ngModel)]="selectedProjectKey"
        class="ctx-select"
        [disabled]="!(memberships$ | async)?.length"
      >
        <option [ngValue]="null" disabled>Select Project</option>
        <option
          *ngFor="let membership of memberships$ | async"
          [ngValue]="membership.project.projectKey"
        >
          {{ membership.project.displayName }}
        </option>
      </select>

      <select
        [(ngModel)]="selectedTestPlanId"
        class="ctx-select"
        [disabled]="!selectedProjectKey || !(testPlans$ | async)?.length"
      >
        <option [ngValue]="null" disabled>Select Test Plan</option>
        <option
          *ngFor="let plan of testPlans$ | async"
          [ngValue]="plan.testPlanId"
        >
          {{ plan.name }}
        </option>
      </select>
    </div>

    <div class="actions">
      <button class="icon-btn" (click)="refreshData()" title="Refresh">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M8 16H3v5"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main layout: Sidebar + Content -->
  <div class="main-layout">
    <!-- Left Sidebar Tree -->
    <app-dashboard-sidebar
      [suiteTree]="suiteTree$ | async"
      [selectedProjectKey]="selectedProjectKey"
      (nodeSelected)="onTreeNodeSelected($event)"
    ></app-dashboard-sidebar>

    <!-- Right Content Panel -->
    <app-dashboard-content
      [selectedProjectKey]="selectedProjectKey"
      [selectedTestPlanId]="selectedTestPlanId"
      [selectedNode]="selectedTreeNode"
    ></app-dashboard-content>
  </div>

  <!-- Global loading/error overlays (optional) -->
  <div *ngIf="loading" class="global-loader">
    <app-spinner label="Loading..."></app-spinner>
  </div>
  <app-error-banner
    *ngIf="errorMessage"
    [message]="errorMessage"
    (dismissed)="errorMessage = ''"
  ></app-error-banner>
</div>
