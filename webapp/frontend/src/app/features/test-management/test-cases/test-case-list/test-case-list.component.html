<div class="test-case-list-container">
  <header class="header">
    <div class="title-section">
      <h2>Test Cases</h2>
      <span *ngIf="suiteName$ | async as suiteName" class="suite-name">
        {{ suiteName }}
      </span>
    </div>
    <button class="back-btn" (click)="backToOverview()">
      ← Back to Overview
    </button>
  </header>

  <div *ngIf="errorMessage" class="error-state">
    <app-error-banner
      [message]="errorMessage"
      (dismissed)="errorMessage = ''"
    ></app-error-banner>
  </div>

  <ng-container *ngIf="testCases$ | async as testCases; else loading">
    <div *ngIf="testCases.length > 0; else empty" class="test-cases-grid">
      <div *ngFor="let tc of testCases" class="test-case-card" (click)="selectTestCase(tc)">
        <div class="card-header">
          <span class="identifier">
            {{ tc.testSuite?.project?.projectKey || '' }}-{{ tc.identifierNumber }}
          </span>
          <app-status-badge [status]="tc.status"></app-status-badge>
        </div>
        <h3 class="title">{{ tc.title }}</h3>
        <p class="description">{{ tc.description }}</p>
        <div class="meta">
          <span class="created-by">Created by {{ tc.stamp.createdBy.username }}</span>
          <span class="created-at">{{ tc.stamp.timeStamp.createdAt | date: 'mediumDate' }}</span>
        </div>
      </div>
    </div>

    <ng-template #empty>
      <div class="empty-state">
        <p>No test cases found in this suite.</p>
        <button class="create-btn">+ Create First Test Case</button>
      </div>
    </ng-template>
  </ng-container>

  <ng-template #loading>
    <div class="loading-state">
      <app-spinner label="Loading test cases..."></app-spinner>
    </div>
  </ng-template>
</div>
