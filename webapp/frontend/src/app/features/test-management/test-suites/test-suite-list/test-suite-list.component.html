<div class="suite-list-container">
  <header class="header">
    <h2>Test Suites</h2>
    <button class="back-btn" (click)="backToProjects()">← Back to Projects</button>
  </header>

  <!-- Error -->
  <div *ngIf="errorMessage" class="error-state">
    <app-error-banner
      [message]="errorMessage"
      (dismissed)="errorMessage = ''">
    </app-error-banner>
  </div>

  <!-- Data -->
  <ng-container *ngIf="suites$ | async as suites; else loading">

    <!-- Empty state -->
    <div *ngIf="suites.length > 0; else empty" class="suites-tree">
      <ng-container
        *ngTemplateOutlet="tree; context: { $implicit: suites }">
      </ng-container>
    </div>

    <ng-template #empty>
      <div class="empty-state">
        <p>No test suites found for this project.</p>
        <button class="create-btn">+ Create First Suite</button>
      </div>
    </ng-template>

  </ng-container>

  <!-- Loading -->
  <ng-template #loading>
    <div class="loading-state">
      <app-spinner label="Loading test suites..."></app-spinner>
    </div>
  </ng-template>
</div>

<!-- ================= TREE ================= -->
<ng-template #tree let-suites>
  <ul class="tree">
    <li *ngFor="let suite of suites" class="tree-node">

      <div class="node-content">

        <!-- Expand toggle -->
        <span
          class="expand-toggle"
          [class.has-children]="hasChildren(suite)"
          (click)="toggleSuite(suite, $event)">

          <span *ngIf="hasChildren(suite)">
            {{ isExpanded(suite) ? '▼' : '▶' }}
          </span>

          <span *ngIf="!hasChildren(suite)">•</span>
        </span>

        <!-- Suite navigation -->
        <span class="suite-icon" (click)="selectSuite(suite)">📁</span>
        <span class="suite-name" (click)="selectSuite(suite)">
          {{ suite.name }}
        </span>

        <!-- Optional loading indicator -->
        <span *ngIf="suite.loading" class="loading-indicator">
          <app-spinner [inline]="true"></app-spinner>
        </span>

      </div>

      <!-- Children (recursive) -->
      <ng-container *ngIf="isExpanded(suite) && hasChildren(suite)">
        <ng-container
          *ngTemplateOutlet="tree; context: { $implicit: suite.children ?? [] }">
        </ng-container>
      </ng-container>

    </li>
  </ul>
</ng-template>
