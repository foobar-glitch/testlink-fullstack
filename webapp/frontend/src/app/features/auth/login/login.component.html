<form (ngSubmit)="onSubmit()">
  <div class="input-group">
    <input
      [(ngModel)]="username"
      name="username"
      placeholder="Username"
      required
    />
  </div>

  <div class="input-group">
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Password"
      required
    />
  </div>

  <button type="submit" [disabled]="loading">
    <app-spinner *ngIf="loading" [inline]="true"></app-spinner>
    <span *ngIf="!loading">Login</span>
  </button>
</form>
