<div class="shell">

  <!-- ── TOP BAR ────────────────────────────────────────────────────────── -->
  <header class="topbar">

    <!-- Brand -->
    <a class="brand" routerLink="/desktop">
      <div class="brand-mark">TF</div>
      <span class="brand-name">Test<span class="brand-accent">Flow</span></span>
    </a>

    <div class="topbar-divider"></div>

    <!-- ── Module navigation (icon buttons, like TestLink) ─────────────── -->
    <nav class="module-nav" aria-label="Module navigation">

      <!-- Desktop / Home -->
      <a
        class="module-nav-btn"
        routerLink="/desktop"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        title="Desktop"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Desktop</span>
      </a>

      <!-- Requirements (not implemented) -->
      <a
        class="module-nav-btn module-nav-btn--disabled"
        routerLink="/requirements"
        routerLinkActive="active"
        title="Requirements (not yet implemented)"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span>Requirements</span>
      </a>

      <!-- Test Specification (not implemented) -->
      <a
        class="module-nav-btn module-nav-btn--disabled"
        routerLink="/specification"
        routerLinkActive="active"
        title="Test Specification (not yet implemented)"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <!-- Tree: one parent block, 3 children -->
          <rect x="8" y="2" width="8" height="5" rx="1"/>
          <rect x="1" y="16" width="6" height="5" rx="1"/>
          <rect x="9" y="16" width="6" height="5" rx="1"/>
          <rect x="17" y="16" width="6" height="5" rx="1"/>
          <line x1="12" y1="7" x2="12" y2="13"/>
          <line x1="4" y1="13" x2="20" y2="13"/>
          <line x1="4" y1="13" x2="4" y2="16"/>
          <line x1="12" y1="13" x2="12" y2="16"/>
          <line x1="20" y1="13" x2="20" y2="16"/>
        </svg>
        <span>Spec</span>
      </a>

      <!-- Test Execution / Explorer -->
      <a
        class="module-nav-btn"
        routerLink="/explorer"
        routerLinkActive="active"
        title="Test Execution"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="6" y1="12" x2="10" y2="12"/>
          <line x1="8" y1="10" x2="8" y2="14"/>
          <line x1="15" y1="13" x2="15.01" y2="13" stroke-linecap="round" stroke-width="3"/>
          <line x1="18" y1="11" x2="18.01" y2="11" stroke-linecap="round" stroke-width="3"/>
          <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.01.152C2.692 10.76 3 12 3 12s.508 2.5 2 4c1.506 1.514 3 2 3 2h8s1.494-.486 3-2c1.492-1.5 2-4 2-4s.308-1.24.308-3.258c0-.051-.004-.1-.01-.152A4 4 0 0 0 17.32 5z"/>
        </svg>
        <span>Execution</span>
      </a>

      <!-- Test Reports (not implemented) -->
      <a
        class="module-nav-btn module-nav-btn--disabled"
        routerLink="/reports"
        routerLinkActive="active"
        title="Test Reports (not yet implemented)"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <span>Reports</span>
      </a>

    </nav>

    <div class="topbar-divider"></div>

    <!-- Context selector — Project -->
    <div class="context-group">
      <span class="ctx-label">Project</span>
      <select
        class="ctx-select"
        [ngModel]="selectedProjectKey"
        (change)="onProjectChange($event)"
      >
        <option value="" disabled>Select project…</option>
        <option *ngFor="let m of memberships$ | async" [value]="m.project.projectKey">
          {{ m.project.displayName }}
        </option>
      </select>
    </div>

    <!-- Spacer -->
    <div class="topbar-spacer"></div>

    <!-- Right-side utilities -->
    <div class="topbar-actions">

      <button class="topbar-util-btn" (click)="refresh()" title="Refresh">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M8 16H3v5"/>
        </svg>
      </button>

      <button class="topbar-util-btn" (click)="toggleSidebar()" title="Toggle sidebar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
      </button>

      <div class="user-avatar" [title]="currentUser?.username ?? ''">{{ initials }}</div>

      <button class="topbar-util-btn topbar-util-btn--danger" title="Logout" (click)="logout()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>

    </div>
  </header>

  <!-- ── BODY (sidebar + content) ──────────────────────────────────────── -->
  <div class="body">

    <!-- Sidebar — always present when authenticated -->
    <aside class="sidebar" [class.collapsed]="sidebarCollapsed" *ngIf="showSidebar">

      <!-- ── SIDEBAR FRAME TABS ────────────────────────────────────────── -->
      <div class="sidebar-tabs" *ngIf="!sidebarCollapsed">
        <button
          class="sidebar-tab"
          [class.active]="activeSidebarFrame === 'settings'"
          (click)="activeSidebarFrame = 'settings'"
          title="Settings"
        >
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          Settings
        </button>
        <button
          class="sidebar-tab"
          [class.active]="activeSidebarFrame === 'filters'"
          (click)="activeSidebarFrame = 'filters'"
          title="Filters"
        >
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
          </svg>
          Filters
        </button>
        <button
          class="sidebar-tab"
          [class.active]="activeSidebarFrame === 'explorer'"
          (click)="activeSidebarFrame = 'explorer'"
          title="Explorer"
        >
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          Explorer
        </button>
      </div>

      <!-- ── FRAME: SETTINGS ───────────────────────────────────────────── -->
      <div class="sidebar-frame" *ngIf="!sidebarCollapsed && activeSidebarFrame === 'settings'">
        <div class="frame-section">
          <label class="frame-label">Test Plan</label>
          <select
            class="frame-select"
            [ngModel]="selectedPlanId"
            (change)="onPlanChange($event)"
            [disabled]="!selectedProjectKey"
          >
            <option value="" disabled>Select plan…</option>
            <option *ngFor="let plan of testPlans$ | async" [value]="plan.testPlanId">
              {{ plan.name }}
            </option>
          </select>
        </div>

        <div class="frame-section">
          <label class="frame-label">Platform</label>
          <select class="frame-select" disabled>
            <option value="400M">400M</option>
            <option value="400M-2K1L">400M-2 K 1L</option>
          </select>
          <span class="frame-hint">Not implemented</span>
        </div>

        <div class="frame-section">
          <label class="frame-label">Build</label>
          <select class="frame-select" disabled>
            <option value="rc1">rc1</option>
            <option value="rc2">rc2</option>
            <option value="final">final</option>
          </select>
          <span class="frame-hint">Not implemented</span>
        </div>
      </div>

      <!-- ── FRAME: FILTERS ────────────────────────────────────────────── -->
      <div class="sidebar-frame sidebar-frame--filters" *ngIf="!sidebarCollapsed && activeSidebarFrame === 'filters'">

        <div class="frame-section">
          <label class="frame-label">Test Case ID</label>
          <input class="frame-input" type="text"
                 [placeholder]="(selectedProjectKey || 'PRJ') + '-...'"
                 [(ngModel)]="filterTcId"/>
        </div>

        <div class="frame-section">
          <label class="frame-label">Test Case Title</label>
          <input class="frame-input" type="text" placeholder="Search title…" [(ngModel)]="filterTcTitle"/>
        </div>

        <div class="frame-section">
          <label class="frame-label">Keyword</label>
          <select class="frame-select" [(ngModel)]="filterKeyword">
            <option value="">Any</option>
            <option value="automated">automated</option>
            <option value="automation_desired">automation_desired</option>
            <option value="entrance-test">entrance-test</option>
            <option value="final-test">final-test</option>
            <option value="initial_4.9.1">initial created in 4.9.1</option>
            <option value="initial_4.9.1.2">initial created in 4.9.1.2</option>
            <option value="initial_4.9.1.3">initial created in 4.9.1.3</option>
          </select>
        </div>

        <div class="frame-section">
          <label class="frame-label">Priority</label>
          <select class="frame-select" [(ngModel)]="filterPriority">
            <option value="">Any</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>

        <div class="frame-section">
          <label class="frame-label">Execution Type</label>
          <select class="frame-select" [(ngModel)]="filterExecType">
            <option value="">Any</option>
            <option value="manual">Manual</option>
            <option value="automated">Automated</option>
          </select>
        </div>

        <div class="frame-section">
          <label class="frame-label">Assigned To</label>
          <select class="frame-select" [(ngModel)]="filterAssignedTo">
            <option value="">Any</option>
            <option value="user1">user1</option>
            <option value="user2">user2</option>
          </select>
        </div>

        <div class="frame-section">
          <label class="frame-label">Result</label>
          <select class="frame-select" [(ngModel)]="filterResult">
            <option value="">Any</option>
            <option value="NOT_RUN">Not Run</option>
            <option value="PASSED">Passed</option>
            <option value="FAILED">Failed</option>
            <option value="BLOCKED">Blocked</option>
            <option value="SKIPPED">Skipped</option>
          </select>
        </div>

        <div class="frame-section">
          <label class="frame-label">On</label>
          <select class="frame-select" [(ngModel)]="filterOnBuild" (ngModelChange)="onFilterBuildChange($event)">
            <option value="latest">Latest Execution</option>
            <option value="all">ALL Builds</option>
            <option value="any">ANY Build</option>
            <option value="specific">Specific Build</option>
          </select>
          <select class="frame-select frame-select--mt" *ngIf="filterOnBuild === 'specific'" [(ngModel)]="filterSpecificBuild">
            <option value="rc1">rc1</option>
            <option value="rc2">rc2</option>
            <option value="final">final</option>
          </select>
        </div>

        <div class="filter-actions">
          <button class="filter-btn filter-btn--primary" (click)="applyFilters()">Apply</button>
          <button class="filter-btn" (click)="resetFilters()">Reset Filters</button>
          <button class="filter-btn" (click)="toggleCustomFields()">
            {{ showCustomFields ? 'Hide Custom Fields' : 'Show Custom Fields' }}
          </button>
          <button class="filter-btn" (click)="toggleAdvancedFilters()">Advanced Filters</button>
        </div>
      </div>

      <!-- ── FRAME: EXPLORER ───────────────────────────────────────────── -->
      <ng-container *ngIf="!sidebarCollapsed && activeSidebarFrame === 'explorer'">
        <div class="sidebar-tree-header">
          <span class="tree-label">Test Suites</span>
          <div class="tree-actions">
            <button class="tree-btn" (click)="expandAll()" title="Expand all">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
              </svg>
            </button>
            <button class="tree-btn" (click)="collapseAll()" title="Collapse all">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M4 14h6v6M14 4h6v6M4 20l7-7M20 4l-7 7"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="sidebar-search">
          <div class="search-wrap">
            <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
            </svg>
            <input type="text" placeholder="Search test cases…"
                   [(ngModel)]="treeSearch"
                   (ngModelChange)="onSearchChange($event)"/>
          </div>
        </div>

        <div class="sidebar-tree" *ngIf="!(suiteLoading$ | async); else treeLoading">
          <ng-container *ngIf="filteredSuites.length > 0; else noSuites">
            <app-suite-tree-node
              *ngFor="let suite of filteredSuites"
              [suite]="suite"
              [depth]="0"
            ></app-suite-tree-node>
          </ng-container>
          <ng-template #noSuites>
            <div class="tree-empty">
              <p>{{ selectedProjectKey ? 'No suites found' : 'Select a project to browse suites' }}</p>
            </div>
          </ng-template>
        </div>

        <ng-template #treeLoading>
          <div class="tree-loading">
            <app-spinner label="Loading suites…"></app-spinner>
          </div>
        </ng-template>
      </ng-container>

    </aside>

    <!-- Main content area -->
    <main class="content" [class.full-width]="!showSidebar">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
