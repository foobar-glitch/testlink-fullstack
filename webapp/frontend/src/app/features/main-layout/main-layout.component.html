<div class="shell">

  <!-- ── TOP BAR ────────────────────────────────────────────────────────── -->
  <header class="topbar">

    <!-- Brand -->
    <a class="brand" routerLink="/desktop">
      <div class="brand-mark">TF</div>
      <span class="brand-name">Test<span class="brand-accent">Flow</span></span>
    </a>

    <div class="topbar-divider"></div>

    <!-- ── Module navigation (icon buttons, like TestLink) ─────────────── -->
    <nav class="module-nav" aria-label="Module navigation">

      <!-- Desktop / Home -->
      <a class="module-nav-btn" routerLink="/desktop" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" title="Desktop">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Desktop</span>
      </a>

      <!-- Requirements (not implemented) -->
      <a class="module-nav-btn module-nav-btn--disabled" routerLink="/requirements" routerLinkActive="active" title="Requirements (not yet implemented)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span>Requirements</span>
      </a>

      <!-- Test Specification (not implemented) -->
      <a class="module-nav-btn module-nav-btn--disabled" routerLink="/specification" routerLinkActive="active" title="Test Specification (not yet implemented)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="8" y="2" width="8" height="5" rx="1"/>
          <rect x="1" y="16" width="6" height="5" rx="1"/>
          <rect x="9" y="16" width="6" height="5" rx="1"/>
          <rect x="17" y="16" width="6" height="5" rx="1"/>
          <line x1="12" y1="7" x2="12" y2="13"/>
          <line x1="4" y1="13" x2="20" y2="13"/>
          <line x1="4" y1="13" x2="4" y2="16"/>
          <line x1="12" y1="13" x2="12" y2="16"/>
          <line x1="20" y1="13" x2="20" y2="16"/>
        </svg>
        <span>Spec</span>
      </a>

      <!-- Test Execution / Explorer -->
      <a class="module-nav-btn" routerLink="/explorer" routerLinkActive="active" title="Test Execution">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="6" y1="12" x2="10" y2="12"/>
          <line x1="8" y1="10" x2="8" y2="14"/>
          <line x1="15" y1="13" x2="15.01" y2="13" stroke-linecap="round" stroke-width="3"/>
          <line x1="18" y1="11" x2="18.01" y2="11" stroke-linecap="round" stroke-width="3"/>
          <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.01.152C2.692 10.76 3 12 3 12s.508 2.5 2 4c1.506 1.514 3 2 3 2h8s1.494-.486 3-2c1.492-1.5 2-4 2-4s.308-1.24.308-3.258c0-.051-.004-.1-.01-.152A4 4 0 0 0 17.32 5z"/>
        </svg>
        <span>Execution</span>
      </a>

      <!-- Test Reports (not implemented) -->
      <a class="module-nav-btn module-nav-btn--disabled" routerLink="/reports" routerLinkActive="active" title="Test Reports (not yet implemented)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <span>Reports</span>
      </a>

    </nav>

    <div class="topbar-divider"></div>

    <!-- Context selector — Project -->
    <div class="context-group">
      <span class="ctx-label">Project</span>
      <select class="ctx-select" [ngModel]="selectedProjectKey" (change)="onProjectChange($event)">
        <option value="" disabled>Select project…</option>
        <option *ngFor="let m of memberships$ | async" [value]="m.project.projectKey">
          {{ m.project.displayName }}
        </option>
      </select>
    </div>

    <!-- Spacer -->
    <div class="topbar-spacer"></div>

    <!-- Right-side utilities -->
    <div class="topbar-actions">

      <div class="user-avatar" [title]="currentUser?.username ?? ''">{{ initials }}</div>

      <button class="topbar-util-btn topbar-util-btn--danger" title="Logout" (click)="logout()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>

    </div>
  </header>

  <!-- ── BODY (content only) ──────────────────────────────────────────── -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>

</div>
