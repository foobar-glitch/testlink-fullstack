<!-- Suite row -->
<div
  class="node-row"
  [class.selected]="isSuiteSelected"
  [style.padding-left.px]="12 + depth * 14"
  (click)="onSuiteClick()"
>
  <!-- Expand toggle -->
  <button class="toggle-btn" (click)="onToggle($event)">
    <svg
      width="10" height="10"
      viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="3"
      [class.open]="isOpen"
    >
      <path d="m9 18 6-6-6-6"/>
    </svg>
  </button>

  <!-- Folder icon -->
  <svg
    class="node-icon folder"
    width="14" height="14"
    viewBox="0 0 24 24" fill="none"
    [attr.stroke]="isOpen ? '#6c63ff' : '#999'"
    stroke-width="2"
  >
    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
  </svg>

  <span class="node-name">{{ suite.name }}</span>

  <span class="node-badge" *ngIf="suite.children?.length">{{ suite.children.length }}</span>
</div>

<!-- Recursive children -->
<div class="node-children" *ngIf="isOpen && suite.children?.length">
  <app-spec-suite-tree-node
    *ngFor="let child of suite.children"
    [suite]="child"
    [depth]="depth + 1"
  ></app-spec-suite-tree-node>
</div>

<!-- Test cases within this suite -->
<div class="cases-list" *ngIf="isOpen">
  <ng-container *ngIf="testCases$ | async as cases; else casesLoading">
    <div
      *ngFor="let tc of cases"
      class="case-row"
      [class.selected]="isCaseSelected(tc)"
      [style.padding-left.px]="42 + depth * 14"
      (click)="onCaseClick($event, tc)"
    >
      <!-- Test case icon (doc with checkmark) -->
      <svg
        class="case-icon"
        width="13" height="13"
        viewBox="0 0 24 24" fill="none"
        stroke="#bbb" stroke-width="2.5"
      >
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <path d="m9 12 2 2 4-4" stroke="#bbb"/>
      </svg>
      <span class="case-name">{{ tc.title }}</span>
      <span class="case-id">{{ tc.testSuite?.project?.projectKey }}-{{ tc.identifierNumber }}</span>
    </div>

    <div class="tree-empty" *ngIf="cases.length === 0" [style.padding-left.px]="42 + depth * 14">
      No test cases
    </div>
  </ng-container>

  <ng-template #casesLoading>
    <div class="cases-loading" [style.padding-left.px]="42 + depth * 14">
      Loading…
    </div>
  </ng-template>
</div>
