<!-- specification-view.component.html -->
<div class="spec-view">

  <!-- ── No project selected ── -->
  <div class="welcome-state" *ngIf="!(projectKey$ | async)">
    <div class="welcome-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
    </div>
    <h2>Test Specification</h2>
    <p>Select a project from the sidebar to browse test suites and test cases.</p>
  </div>

  <ng-container *ngIf="projectKey$ | async as projectKey">

    <!-- ── Suite selected — show suite overview ── -->
    <ng-container *ngIf="(suiteId$ | async) && !(testCaseId$ | async)">

      <!-- Suite header -->
      <header class="page-header" *ngIf="suiteName$ | async as suiteName">
        <div class="breadcrumb">
          <span class="bc-project">{{ projectKey }}</span>
          <span class="bc-sep">›</span>
          <span class="bc-suite">{{ suiteName }}</span>
        </div>
        <h1>{{ suiteName }}</h1>
      </header>

      <!-- Test case table for the suite -->
      <ng-container *ngIf="testCasesForSuite$ | async as cases; else loadingCases">
        <app-test-case-table
          *ngIf="cases.length; else noTestCases"
          [cases]="cases"
          (caseSelected)="onCaseSelected($event)"
        ></app-test-case-table>

        <ng-template #noTestCases>
          <div class="empty-state">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <path d="M9 12l2 2 4-4"/>
            </svg>
            <p>No test cases in this suite.</p>
          </div>
        </ng-template>
      </ng-container>

      <ng-template #loadingCases>
        <div class="loading-state">
          <app-spinner label="Loading test cases…"></app-spinner>
        </div>
      </ng-template>

    </ng-container>

    <!-- ── Test case selected — show detail + tabs ── -->
    <ng-container *ngIf="testCaseId$ | async as testCaseId">

      <!-- Tab bar -->
      <div class="tabs">
        <button
          class="tab"
          [class.active]="(activeTab$ | async) === 'details'"
          (click)="setTab('details')"
        >Details</button>
        <button
          class="tab"
          [class.active]="(activeTab$ | async) === 'steps'"
          (click)="setTab('steps')"
        >Steps</button>
        <button
          class="tab"
          [class.active]="(activeTab$ | async) === 'versions'"
          (click)="setTab('versions')"
        >Versions</button>
      </div>

      <!-- Tab content -->
      <ng-container [ngSwitch]="activeTab$ | async">

        <app-test-case-detail
          *ngSwitchCase="'details'"
        ></app-test-case-detail>

        <app-test-case-version-content
          *ngSwitchCase="'steps'"
        ></app-test-case-version-content>

        <app-test-case-version-list
          *ngSwitchCase="'versions'"
        ></app-test-case-version-list>

        <!-- default -->
        <app-test-case-detail *ngSwitchDefault></app-test-case-detail>

      </ng-container>

    </ng-container>

    <!-- ── No suite selected (project exists) ── -->
    <div class="welcome-state" *ngIf="!(suiteId$ | async) && !(testCaseId$ | async)">
      <div class="welcome-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <h2>Select a test suite</h2>
      <p>Choose a suite in the tree on the left to view its test cases.</p>
    </div>

  </ng-container>

</div>
