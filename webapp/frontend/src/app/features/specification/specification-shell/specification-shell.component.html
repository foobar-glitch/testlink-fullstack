<div class="shell">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">

    <!-- Header -->
    <div class="sidebar-header">
      <div class="sidebar-title-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <span class="sidebar-title">Test Specification</span>
      </div>

      <!-- Project context -->
      <div class="context-row" *ngIf="projectKey$ | async as key">
        <span class="context-chip">{{ key }}</span>
      </div>
    </div>

    <!-- Tree loading / error -->
    <div class="sidebar-loading" *ngIf="loading">
      <app-spinner [inline]="true" label="Loading suites…"></app-spinner>
    </div>

    <div class="sidebar-error" *ngIf="errorMsg">
      <span>⚠ {{ errorMsg }}</span>
    </div>

    <!-- Suite tree -->
    <div class="tree-scroll" *ngIf="!loading && rootSuites.length">
      <app-spec-suite-tree-node
        *ngFor="let suite of rootSuites"
        [suite]="suite"
        [depth]="0"
      ></app-spec-suite-tree-node>
    </div>

    <!-- Empty state -->
    <div class="tree-empty" *ngIf="!loading && !errorMsg && rootSuites.length === 0">
      <p>No test suites found.</p>
    </div>

  </aside>

  <!-- ── Main content ── -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
