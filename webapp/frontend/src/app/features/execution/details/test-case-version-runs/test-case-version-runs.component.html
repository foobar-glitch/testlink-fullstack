<div class="runs-container">
  <header class="page-header">
    <h2>Execution History</h2>
    <p class="header-sub">Version {{ versionNumber }} · {{ projectKey }}-{{ testCaseIdentifier }}</p>
  </header>

  <app-error-banner *ngIf="errorMessage" [message]="errorMessage" (dismissed)="errorMessage = ''"></app-error-banner>

  <ng-container *ngIf="runs$ | async as runs; else loading">
    <app-execution-table
      [items]="runs"
      (itemSelected)="onRunSelected($event)"
      *ngIf="runs.length; else empty"
    ></app-execution-table>
    <ng-template #empty>
      <div class="empty-state">No execution records found for this version.</div>
    </ng-template>
  </ng-container>

  <ng-template #loading>
    <div class="loading-state">
      <app-spinner label="Loading execution history..."></app-spinner>
    </div>
  </ng-template>
</div>
