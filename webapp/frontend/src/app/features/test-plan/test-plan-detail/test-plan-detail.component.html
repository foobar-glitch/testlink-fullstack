<!-- test-plan-detail.component.html -->
<div class="run-list-container">
  <header class="header">
    <div class="title-section">
      <h2>Test Runs</h2>
      <span *ngIf="testPlanName$ | async as planName" class="plan-name">
        {{ planName }}
      </span>
    </div>
    <button
      class="back-btn"
      [routerLink]="['/test-plans']"
      [queryParams]="{ project: projectKey }"
    >
      ← Back to Test Plans
    </button>
  </header>

  <div *ngIf="errorMessage" class="error-state">
    <app-error-banner [message]="errorMessage" (dismissed)="errorMessage = ''"></app-error-banner>
  </div>

  <ng-container *ngIf="runs$ | async as runs; else loading">
    <div *ngIf="runs.length > 0; else empty" class="runs-grid">
      <div
        *ngFor="let run of runs"
        class="run-card"
        (click)="selectRun(run)"
        role="button"
        tabindex="0"
        (keydown.enter)="selectRun(run)"
      >
        <div class="card-header">
          <h3>{{ run.name }}</h3>
          <span class="build" *ngIf="run.build">{{ run.build }}</span>
        </div>
        <div class="meta">
          <span class="environment" *ngIf="run.environment">
            🌍 {{ run.environment }}
          </span>
          <span class="created">
            Created {{ run.stamp.timeStamp.createdAt | date: 'mediumDate' }}
          </span>
        </div>
      </div>
    </div>
    <ng-template #empty>
      <div class="empty-state">
        <p>No test runs found for this test plan.</p>
        <button class="create-btn">+ Create First Run</button>
      </div>
    </ng-template>
  </ng-container>

  <ng-template #loading>
    <div class="loading-state">
      <app-spinner label="Loading test runs..."></app-spinner>
    </div>
  </ng-template>
</div>
