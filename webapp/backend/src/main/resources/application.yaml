spring:
  application:
    name: webapp
  config:
    import: file:../../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:testlink_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:rootsecret}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080